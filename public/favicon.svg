<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo circular -->
  <circle cx="16" cy="16" r="15" fill="#0f1117" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Grilla 2×2 con check en celda inferior derecha -->
  <!-- Fila superior izquierda -->
  <rect x="7" y="7" width="7" height="7" rx="1.5" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <!-- Fila superior derecha -->
  <rect x="18" y="7" width="7" height="7" rx="1.5" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <!-- Fila inferior izquierda -->
  <rect x="7" y="18" width="7" height="7" rx="1.5" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <!-- Fila inferior derecha — rellena con acento -->
  <rect x="18" y="18" width="7" height="7" rx="1.5" fill="#3b82f6"/>
  <!-- Checkmark en la celda acento -->
  <polyline points="19.8,21.5 21,22.8 25.2,19.5" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
